<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abisso</title>

<style>

body{
margin:0;
background:#09070f;
font-family:Arial;
color:white;
overflow-x:hidden;
}

header{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(to bottom,#000000,#1a0826,#2d1144);
text-align:center;
}

h1{
font-size:70px;
color:#d18cff;
text-shadow:0 0 20px #d18cff;
margin:0;
animation:glow 2s infinite alternate;
}

p{
font-size:22px;
color:#ffb3e6;
}

button{
margin-top:20px;
padding:15px 40px;
font-size:20px;
border:none;
border-radius:30px;
background:#7b2cbf;
color:white;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ff4fd8;
transform:scale(1.1);
box-shadow:0 0 20px #ff4fd8;
}

.section{
padding:50px 20px;
}

.manga-card{
background:#140d1f;
padding:20px;
margin:20px;
border-radius:20px;
box-shadow:0 0 20px rgba(209,140,255,0.2);
transition:0.3s;
}

.manga-card:hover{
transform:translateY(-10px);
box-shadow:0 0 30px rgba(255,79,216,0.5);
}

@keyframes glow{
from{
text-shadow:0 0 10px #d18cff;
}
to{
text-shadow:0 0 30px #ff4fd8;
}
}

</style>
</head>

<body>

<header>

<h1>Abisso</h1>

<p>Dark Romance Manga Platform</p>

<button>Czytaj teraz</button>

</header>

<div class="section">

<h2>🔥 Popularne teraz</h2>

<div class="manga-card">
<h3>Twoja przyszła manga</h3>
<p>0 wyświetleń • ❤️ 0</p>
<p>Ranga: S</p>
</div>

</div>

</body>
  </html>
